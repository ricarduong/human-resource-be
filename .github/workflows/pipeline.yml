name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Required secrets:
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token (Settings > Security > Access Tokens)

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Unit Test
  # Runs on every PR and every push
  # ─────────────────────────────────────────────
  lint-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

  # ─────────────────────────────────────────────
  # Job 1b: Security Scan for Pull Requests
  # Build image locally and scan for vulnerabilities
  # Runs on every PR to catch security issues early
  # ─────────────────────────────────────────────
  security-scan-pr:
    name: Security Scan (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: hrm-backend:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: hrm-backend:scan-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ─────────────────────────────────────────────
  # Job 2: Build & Push Docker image
  # Only runs on push to main, after lint-test passes
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Only tag with SHA — avoid overwriting :latest which makes rollback harder
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hrm-backend:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up dangling images
        if: always()
        run: docker image prune -f

  # ─────────────────────────────────────────────
  # Job 2b: Security Scan
  # Scan Docker image for vulnerabilities using Trivy
  # Runs after build, in parallel with deploy
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/hrm-backend:sha-${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ─────────────────────────────────────────────
  # Job 3: Deploy to Kubernetes
  # Only runs on push to main, after image is pushed
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to k8s
    runs-on: local-mac
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Verify image is pullable from Docker Hub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hrm-backend:sha-${{ needs.build.outputs.image_tag }}

      - name: Update image tag in kustomize
        run: |
          cd manifests
          kustomize edit set image hrm-backend=${{ secrets.DOCKERHUB_USERNAME }}/hrm-backend:sha-${{ needs.build.outputs.image_tag }}

      - name: Apply manifests
        run: kubectl apply -k manifests/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hrm-backend \
            -n dev-project --timeout=180s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy failed — rolling back to previous revision"
          kubectl rollout undo deployment/hrm-backend -n dev-project
