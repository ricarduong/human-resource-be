apiVersion: v1
kind: Secret
metadata:
  name: hrm-backend-secret
  namespace: dev-project
  labels:
    app.kubernetes.io/name: hrm-backend
type: Opaque
# ---------------------------------------------------------------------------
# All values MUST be base64-encoded.
# Generate with:  echo -n "your-value" | base64
#
# Example:
#   DATABASE_URL → echo -n "mysql://user:pass@mariadb:3306/hrm_db" | base64
#   JWT_SECRET   → echo -n "your-super-secret-key" | base64
#   GOOGLE_CLIENT_ID → echo -n "xxx.apps.googleusercontent.com" | base64
# ---------------------------------------------------------------------------
stringData:
  # Use stringData so you can paste plain-text values during local development.
  # Kubernetes will base64-encode them automatically before storing.
  DATABASE_URL: "mysql://nduong:b1310493@host.docker.internal:3306/human_resource"
  JWT_SECRET: "change-me-in-production"
  GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
