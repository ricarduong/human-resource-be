apiVersion: v1
kind: ConfigMap
metadata:
  name: hrm-backend-config
  namespace: dev-project
  labels:
    app.kubernetes.io/name: hrm-backend
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  # Comma-separated list of allowed CORS origins
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
  # JWT expiry (non-sensitive)
  JWT_EXPIRES_IN: "7d"
