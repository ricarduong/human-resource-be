apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm-backend
  namespace: dev-project
  labels:
    app.kubernetes.io/name: hrm-backend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hrm-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # Zero-downtime rolling update
  template:
    metadata:
      labels:
        app: hrm-backend
        app.kubernetes.io/name: hrm-backend
    spec:
      # -----------------------------------------------------------------------
      # Pull the image built locally with Rancher Desktop (containerd / nerdctl)
      # Build command:
      #   nerdctl build -t hrm-backend:latest .
      # or using docker CLI pointed at Rancher Desktop:
      #   docker build -t hrm-backend:latest .
      # -----------------------------------------------------------------------
      containers:
        - name: hrm-backend
          image: duongnt95/hrm-backend:latest
          # Always use the locally-built image; never pull from a remote registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # --- Environment from ConfigMap (non-sensitive) ---
          envFrom:
            - configMapRef:
                name: hrm-backend-config

          # --- Environment from Secret (sensitive) ---
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hrm-backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrm-backend-secret
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hrm-backend-secret
                  key: GOOGLE_CLIENT_ID

          # --- Liveness probe: restart pod if server hangs ---
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30        # Tăng từ 20s → 30s để giảm tải
            failureThreshold: 3      # 3 × 30s = 90s trước khi restart
            timeoutSeconds: 5

          # --- Readiness probe: only route traffic when truly ready ---
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10        # Giữ nguyên 10s - quan trọng cho traffic routing
            failureThreshold: 3
            timeoutSeconds: 5

          # --- Startup probe: give extra time for first Prisma connection ---
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10        # Tăng từ 5s → 10s để giảm tải startup phase
            failureThreshold: 12     # 12 × 10s = 120s max startup time

          # --- Resource requests & limits ---
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # --- Security context: run as non-root (matches Dockerfile USER nodejs) ---
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Prisma writes generated files at startup
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL

      # --- Pod-level security ---
      securityContext:
        fsGroup: 1001

      # Graceful termination: give SIGTERM handler time to drain (matches server.ts)
      terminationGracePeriodSeconds: 30

      restartPolicy: Always
